name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    full-test:
        container: cuaesd/aesd-autotest:24-assignment5-buildroot
        runs-on: self-hosted
        timeout-minutes: 120
        steps:
          - name: Configure GitHub SSH host key
            run: |
              mkdir -p /root/.ssh
              chmod 700 /root/.ssh

              touch /root/.ssh/known_hosts
              ssh-keygen -R github.com -f /root/.ssh/known_hosts || true
              ssh-keyscan -H -t ed25519,ecdsa,rsa github.com >> /root/.ssh/known_hosts

              chmod 600 /root/.ssh/known_hosts
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run: git submodule update --init --recursive
          - uses: webfactory/ssh-agent@v0.5.3
            with:
                ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          - name: Test GitHub SSH
            run: ssh -T git@github.com || test $? -eq 1
          - name: Run full test
            env:
              GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
              FORCE_UNSAFE_CONFIGURE: "1"
            run: ./full-test.sh
          - name: Cleanup
            if: always()
            run: |
              ssh-add -D
